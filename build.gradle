plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.hw'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// 프로젝트에서 사용하는 전역 변수 설정
ext {
    set('queryDslVersion', "5.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // query dsl
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    annotationProcessor 'org.projectlombok:lombok'

    //implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.2.1'// spring boot와 AwS의 통합을 도와주는 라이브러리
    // implementation 'com.amazonaws:aws-java-sdk-s3:1.12.767' // 자바 에플리케이션에서 s3 버키에 접근 할 수 있게 해주는 라이브러리(25년 12월 31일에 만료)
    implementation 'software.amazon.awssdk:s3:2.29.6' // Amazon에서 제공

    // FCM
    implementation 'com.google.firebase:firebase-admin:9.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'  // Firebase 서버로 푸시 메시지 전송 시 필요
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // csv read
    implementation 'com.opencsv:opencsv:5.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 1. Q-Class 생성 디렉토리 설정
def queryDslSrcDir = 'src/main/generated/querydsl/'

// 2. 자바 컴파일 작업 시 생성 소스코드 출력을 queryDslSrcDir로 지정
tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(queryDslSrcDir))
}

// 3. 소스 코드로 인식할 디렉토리 경로에 Q-Class 파일 추가
sourceSets {
    main.java.srcDirs += [queryDslSrcDir]
}
// 4. clean 작업 수행시 지정 디렉토리 삭제 : 자동 생성된 Q-Class를 삭제
clean {
    delete file(queryDslSrcDir)
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    querydsl.extendsFrom compileClasspath
}

tasks.named('test') {
    useJUnitPlatform()
}
// 테스트 코드를 제외한 빌드 수행
tasks.withType(Test) {
    enabled = false
}
